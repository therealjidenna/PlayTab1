      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          sudo chmod -R a+rwX "$ANDROID_HOME" || true
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PlayTab.apk

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayTab-apk
          path: PlayTab.apk

      - name: Publish APK to the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: PlayTab (latest build)
          body: Download PlayTab.apk below and install it on your Android phone.
          files: PlayTab.apk
